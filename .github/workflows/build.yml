name: Build

on:
  push:
    branches:
      - "v4.x"

env:
  PYTHONIOENCODING: "UTF-8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9.13", "3.10.11", "3.11.9", "3.12.9"]
        os: ["windows"]

    runs-on: ${{ matrix.os }}-latest

    env:
      matrix-name: ${{ matrix.os }}-python${{ matrix.python-version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 2.1.2

      - name: Define venv location
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Define venv caching
        uses: actions/cache@v3
        with:
          path: ./.venv
          key: venv-${{ env.matrix-name }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install

      - name: Build distributable
        run: |
          poetry run python Build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArkUnpacker-${{ env.matrix-name }}-${{ github.ref_name }}-${{ github.sha }}
          path: build/dist/*.*
